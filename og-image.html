<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rahul Prajapati Open Graph Image</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 18%, rgba(0, 217, 255, 0.24), transparent 28%),
        radial-gradient(circle at 8% 86%, rgba(239, 68, 68, 0.28), transparent 30%),
        linear-gradient(135deg, #020617 0%, #0f172a 58%, #111827 100%);
      color: #ffffff;
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    .frame {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      padding: 72px;
    }

    .grid {
      position: absolute;
      inset: 0;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 56px 56px;
    }

    .badge {
      position: relative;
      width: max-content;
      border: 1px solid rgba(248, 113, 113, 0.5);
      border-radius: 14px;
      padding: 12px 16px;
      color: #fecaca;
      background: rgba(127, 29, 29, 0.32);
      font-size: 24px;
      font-weight: 800;
    }

    h1 {
      position: relative;
      margin: 34px 0 0;
      max-width: 850px;
      font-size: 86px;
      line-height: 0.94;
      letter-spacing: 0;
    }

    .role {
      position: relative;
      margin-top: 28px;
      color: #67e8f9;
      font-size: 36px;
      font-weight: 900;
    }

    .line {
      position: relative;
      margin-top: 24px;
      max-width: 840px;
      color: #d1d5db;
      font-size: 28px;
      line-height: 1.35;
      font-weight: 600;
    }

    .footer {
      position: relative;
      display: flex;
      align-items: center;
      gap: 18px;
      color: #e5e7eb;
      font-size: 24px;
      font-weight: 800;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #ffffff;
      color: #020617;
      font-size: 28px;
      font-weight: 950;
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="grid"></div>
    <section>
      <div class="badge">AirAsia MOVE</div>
      <h1>Rahul Prajapati</h1>
      <div class="role">Senior Software Engineer Platform</div>
      <div class="line">Cloud systems, AI agents, and automations that stay calm under pressure.</div>
    </section>
    <section class="footer">
      <div class="mark">RP</div>
      <div>GCP · Kubernetes · Terraform · Cloud SQL · AI Agents · SRE</div>
    </section>
  </main>
</body>
</html>
